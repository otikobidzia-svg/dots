font_size        12
bold_font        auto
italic_font      auto
bold_italic_font auto
mouse_hide_wait  2.0
cursor_shape     block
# url_color        #0087bd
url_style        dotted
#Close the terminal without confirmation
confirm_os_window_close 0

# Keep one persistent kitty process; let other kitty opens hand off to it
# over a socket instead of doing a full (~0.9s) cold start every time.
allow_remote_control yes
listen_on unix:/tmp/kitty-19567
# Transparency needs a compositing window manager. i3 is not one and no
# compositor is installed, so kitty logs "Failed to enable transparency" and
# falls back to an opaque background. Install picom/xcompmgr to make this work.
background_opacity 0.45
# Ensure zsh regardless of inherited $SHELL
shell /bin/zsh

font_family FiraCode Nerd Font

