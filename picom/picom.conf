# picom 12.5 config — maps ~/.config/hypr/hyprland.conf onto X11/i3
# Running the 12.5-r1 build (Alpine v3.23) from ~/.local — see ~/.local/bin/picom.
# v3.24's picom 13 segfaults on this machine at startup, with every backend.
#
# v12.5 gotchas found the hard way:
#  * a `rules: ({...})` block makes the old-style per-window options
#    (corner-radius, shadow, blur-background, active-opacity...) silently
#    no-ops, so everything per-window has to live INSIDE the block;
#  * the old-style CLI patterns (--opacity-rule, --shadow-exclude, ...)
#    fail to parse — "--opacity-rule 0.9:class_g=rofi" gives
#    "Number separator (':') not found". So: rules block only.
#  * it logs "root_damaged: Failed to bind root back pixmap" because setwall
#    owns the root background pixmap. Harmless: the wallpaper still shows
#    through composited windows.

# --- global, not per-window
backend = "xrender";
vsync = true;
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;

# --- Hyprland: blur { enabled = true; size = 1; passes = 5; vibrancy = 0.1696 }
# These are global; only blur-background itself is per-window (below).
# picom can only blur behind ARGB/transparent windows, so it shows through
# kitty (background_opacity 0.45) and rofi — not behind opaque windows.
# Hyprland's "vibrancy" saturation boost has no picom equivalent.
blur-method = "gaussian";
blur-size = 8;                 # Hyprland size = 1 (Hyprland multiplies size by 8)
blur-deviation = 2;            # stands in for "passes = 5"; gaussian is smoother
blur-kern = "3x3box";

rules: ({
  # ---- normal windows: Hyprland rounding = 3 + shadow range 4 rgba(1a1a1aee)
  match = "window_type != 'dock' && window_type != 'desktop'";
  corner-radius = 3;
  shadow = true;
  shadow-radius = 4;
  shadow-opacity = 0.93;       # 0xee / 0xff
  shadow-offset-x = -4;
  shadow-offset-y = -4;
  shadow-color = "#1a1a1a";
  blur-background = true;
  blur-background-fixed = true;
  fade = true;
}, {
  # ---- the GTK bar: fully opaque, square, no blur, no fade
  match = "window_type = 'dock' || window_type = 'desktop'";
  corner-radius = 0;
  shadow = false;
  blur-background = false;
  fade = false;
}, {
  # ---- per-app ("bg app opacity" in Hyprland terms)
  # kitty is deliberately absent: it sets its own background_opacity 0.45 and
  # picom's opacity would multiply with that.
  match = "class_g = 'rofi' || name = 'rofi'";
  opacity = 0.92;
  corner-radius = 0;
  shadow = false;
  fade = false;
}, {
  match = "class_g = 'pavucontrol' || name = 'Volume Control'";
  opacity = 0.95;
}, {
  match = "class_g = 'thunar' || name = 'File Manager'";
  opacity = 0.97;
})
