; i3 + polybar rice  --  Catppuccin Mocha
; Palette: ~/.config/polybar/colors.ini
;
; IMPORTANT -- this is Alpine's polybar 3.7.2 (musl build) and it differs from
; upstream in ways that matter here:
;   * the bar section must be NAMED:  [bar/top], a bare [bar] is rejected
;   * module types need the internal/ prefix (internal/cpu, not cpu)
;   * `pango:` font prefixes silently fall back to Noto Sans; use "Family-10"
;   * there is no %bar{closing-E}, no <label>...</label> blocks, no %{A:cmd:}
;   * `padding` takes a single number, not "0 8 0 8"
;   * internal/i3 and internal/battery are both broken here -> custom scripts
;
; start / restart:  pkill -x polybar; polybar &

include-file = /home/otiko/.config/polybar/colors.ini

[bar/top]
monitor =
width = 100%
height = 34
position = top
reserved-space = yes
padding = 0
enable-anti-aliasing = true
wm-name = i3

background = ${colors.mantle}
foreground = ${colors.text}

font-0 = FiraCode Nerd Font-10
font-1 = FiraCode Nerd Font SemBd-10
font-2 = FiraCode Nerd Font-9

modules-left = logo ws1 ws2 ws3 ws4 ws5 ws6 ws7 ws8 ws9 ws10 title
modules-center =
modules-right = tray net volume temp cpu mem batt date

;---------------------------------------------------------------------------
; left
;---------------------------------------------------------------------------

; NOTE: never give a module a whitespace-only format here. A module whose text
; renders to nothing (e.g. "%{F#b4befe}  %{F-}") makes this polybar build drop
; *every* module on the bar, not just itself -- the whole bar goes blank while
; the bar background still paints. The logo therefore has real text in it.
; Same reason there are no Nerd Font glyphs below: private-use codepoints get a
; zero advance width in this build and the glyphs pile up on top of each other.
[module/logo]
type = custom/text
format = %{U#b4befe}%{F#b4befe}otiko%{U-}%{F-}
font = font-1
click-left = exec rofi -show drun
click-right = exec thunar
tooltip-enabled = false

;--- workspaces -------------------------------------------------------------
; polybar's own i3 module cannot talk to i3 4.24: i3 renamed the root window
; property from _I3_SOCK to I3_SOCKET_PATH, so polybar finds no socket (and
; i3 ignores EWMH workspace changes, so internal/xworkspaces can't be used
; either). polybar-ws-update reads the tree via i3-msg instead.
;
; ws1 does the work and caches a label per workspace; ws2..ws10 just cat it,
; so only one i3-msg call happens per interval instead of ten.

[module/ws1]
type = custom/script
exec = /home/otiko/.local/bin/polybar-ws-update 1 10
interval = 2
format = %output%
click-left = exec i3-msg workspace 1
click-right = exec i3-msg workspace 1
scroll-up = exec i3-msg workspace prev
scroll-down = exec i3-msg workspace next

[module/ws2]
type = custom/script
exec = /home/otiko/.local/bin/polybar-ws-show 2
interval = 2
format = %output%
click-left = exec i3-msg workspace 2
click-right = exec i3-msg workspace 2
scroll-up = exec i3-msg workspace prev
scroll-down = exec i3-msg workspace next

[module/ws3]
type = custom/script
exec = /home/otiko/.local/bin/polybar-ws-show 3
interval = 2
format = %output%
click-left = exec i3-msg workspace 3
click-right = exec i3-msg workspace 3
scroll-up = exec i3-msg workspace prev
scroll-down = exec i3-msg workspace next

[module/ws4]
