; internal/xwindow reads EWMH _NET_ACTIVE_WINDOW, which i3 does set, but on
; this build the module never picks the title up (checked by renaming the
; focused window: the bar did not change). Same i3-msg source as the
; workspace modules instead.
[module/title]
type = custom/script
exec = /home/otiko/.local/bin/polybar-title
interval = 1
format = %output%
click-left = exec rofi -show window
click-right = exec kitty

;---------------------------------------------------------------------------
; right
;---------------------------------------------------------------------------

[module/tray]
type = internal/tray
icon-size = 15
tray-spacing = 8
tooltip-enabled = false

[module/net]
type = internal/network
interface = wlan0
interval = 5
format-connected = %{U#89dceb}%{F#89dceb}  %{F#a6adc8}%essid%{F-}  %{F#585b70}%local_ip%%{F-}
format-disconnected = %{F#585b70}  %{F-}
label-connected = %{U#89dceb}%{F#89dceb}  %{F#a6adc8}%essid%{F-}  %{F#585b70}%local_ip%%{F-}
label-disconnected = %{F#585b70}  %{F-}
ethernet-icon = %{U#a6e3a1}%{F#a6e3a1}  %{F-}

[module/volume]
type = internal/pulseaudio
interval = 2
volume-cap = 0
volume-step = 5
scroll-step = 5
format = %{U#89dceb}%{F#89dceb}  %{F#a6adc8}%volume%%%{F-}
format-muted = %{F#585b70}  %{F-}
label-volume = %{U#89dceb}%{F#89dceb}  %{F#a6adc8}%volume%%%{F-}
label-muted = %{F#585b70}  %{F-}
click-left = exec pactl set-sink-mute @DEFAULT_SINK@ toggle
click-right = exec pactl set-sink-volume @DEFAULT_SINK@ 0%
scroll-up = exec pactl set-sink-volume @DEFAULT_SINK@ +5%
scroll-down = exec pactl set-sink-volume @DEFAULT_SINK@ -5%

[module/temp]
type = internal/temperature
path = /sys/class/hwmon/hwmon2/temp1_input
interval = 5
format = %{F#fab387}  %{F#a6adc8}%temperature%C%{F-}
label-temperature = %{F#fab387}  %{F#a6adc8}%temperature%C%{F-}

[module/cpu]
type = internal/cpu
interval = 2
format = %{F#cba6f7}  %{F#a6adc8}%percentage:0%%%{F-}
label = %{F#cba6f7}  %{F#a6adc8}%percentage:0%%%{F-}

[module/mem]
type = internal/memory
interval = 5
format = %{F#74c7ec}  %{F#a6adc8}%percentage_used:1%%%{F-}
label = %{F#74c7ec}  %{F#a6adc8}%percentage_used:1%%%{F-}

; polybar's internal/battery reads POWER_SUPPLY_STATE from the power_supply
; uevent, but the kernel exposes POWER_SUPPLY_STATUS now, so it disables itself.
[module/batt]
type = custom/script
exec = /home/otiko/.local/bin/polybar-batt
interval = 5
format = %output%

; polybar 3.7.2 here never creates its IPC socket, so `polybar-msg cmd date`
; is a no-op. polybar-date implements the same tap-to-preview-date gesture
; with a marker file and reverts to the clock after 5s.
[module/date]
type = custom/script
exec = /home/otiko/.local/bin/polybar-date
interval = 1
format = %output%
click-left = exec touch /tmp/.polybar-date-alt
click-right = exec sh -c 'polybar-msg cmd date'
